<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Scoutie+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet">

	<style>
		body{ font-family: "Scoutie Sans", sans-serif;; }
		div { color: rgb(1, 24, 14); }
		.quote{ font-size:2rem; }
		.source{ 
			font-style: italic;
			margin-top: 1rem;
		}

		.citation{
			margin: 2rem;
			border: 5px solid rgb(0, 5, 1);
			padding: 2rem; 
			border-radius: 2rem;
			aspect-ratio: 1.4/1;
		}

		.important{ background: rgb(16, 202, 127); }
		.hihi{ background: rgb(3, 103, 73); }

		#pepito{ background: rgb(3, 103, 73); }

		#pickle{ background: rgb(16, 202, 127)}
	
	</style>
		
</head>

<body>

	<div class="citation" id="pepito">
		<div class="quote">" All the Photoshop filters in the world won't save a weak design."</div>
		<div class="source important">-WILLIAM CHILDS</div>
	</div>

	<div class="citation" id="pickle">
		<div class="quote">" I really like looking at design and thinking: that attention to detail must have taken absolutely ages.."</div>
		<div class="source hihi">-SI SCOTT</div>

		

	</div>



	
</body>
</html>
